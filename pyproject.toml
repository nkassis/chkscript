[project]
name = "chkscript"
version = "0.1.0"
description = "Bash script safety analyzer powered by Claude"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "anthropic>=0.40.0,<1.0.0",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
]

[project.scripts]
chkscript = "chkscript.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chkscript"]

[dependency-groups]
dev = [
    "black>=26.10.1",
    "pytest>=8.0",
    "pytest-mock>=3.0",
    "ruff>=0.17.3",
]

[tool.black]
target-version = ["py311"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
# ANN enforces type hints on every signature (CLAUDE-global.md); no mypy.
select = ["E", "F", "W", "I", "B", "UP", "ANN"]
