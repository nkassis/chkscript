[project]
name = "chkscript"
version = "0.1.0"
description = "Bash script safety analyzer powered by Claude"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "anthropic>=0.40.0,<1.0.0",
]

[project.scripts]
chkscript = "chkscript.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chkscript"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.0",
]
