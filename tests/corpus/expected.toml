# Agreed static-layer verdicts for the real-installer corpus (tests/test_corpus.py).
#
# This records what the static layer does today; it is the baseline every rule
# change is judged against. When a rule change moves a result, update the entry
# and say why in the PR.
#
# Per installer: `max_severity`, and one [[<name>.finding]] per rule that fires:
#   rule     static rule id (Semgrep/regex rule, shellcheck SC code, or a
#            chkscript coverage warning)
#   verdict  "true-positive": the matched code runs during install and does
#            what the rule describes.
#            "noise": the match is on text that never runs during install (a
#            heredoc message, the body of a generated file), a wrong span, a
#            lint that is not a safety concern, or a benign idiom the rule was
#            not written for.
#   note     one line; mktemp cleanups say "mktemp cleanup" so they can be counted
#   lines    unsafe-tier rules only: the exact lines that fire
#   engines  optional; defaults to both ["semgrep", "regex"]
#
# shellcheck and semgrep-parse-error entries are pinned by rule id, not line.

[rustup]
max_severity = "unsafe"

[[rustup.finding]]
rule = "unverified-download"
lines = [175]
verdict = "true-positive"
note = "Downloads rustup-init over HTTPS and runs `chmod u+x` with no checksum or signature check; trust rests on TLS alone."

[[rustup.finding]]
rule = "semgrep-parse-error"
engines = ["semgrep"]
verdict = "noise"
note = "Accurate coverage notice (Semgrep cannot fully parse the file), but it says nothing about the script."

[homebrew]
max_severity = "unsafe"

[[homebrew.finding]]
rule = "unverified-download"
lines = [614]
verdict = "noise"
note = "Fires on `sudo chmod 775 ${HOMEBREW_PREFIX}` inside an abort-message heredoc; Homebrew installs via git, not a downloaded executable."

[[homebrew.finding]]
rule = "eval-dynamic"
lines = [1173, 1181]
verdict = "noise"
note = "Both are `eval \"$(brew shellenv)\"` text inside `cat <<EOS` instructions printed for the user, never run by the installer."

[[homebrew.finding]]
rule = "semgrep-parse-error"
engines = ["semgrep"]
verdict = "noise"
note = "Accurate coverage notice (Semgrep cannot fully parse the file), but it says nothing about the script."

