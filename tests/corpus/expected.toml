# Agreed static-layer verdicts for the real-installer corpus (tests/test_corpus.py).
#
# This records what the static layer does today; it is the baseline every rule
# change is judged against. When a rule change moves a result, update the entry
# and say why in the PR.
#
# Per installer: `max_severity` (and `regex_max_severity` when the regex
# fallback differs), one [[<name>.finding]] per rule that fires, and the
# footprint each engine computes ([<name>.footprint] for the syntax tree,
# [<name>.regex_footprint] for the fallback).
#
# A finding entry:
#   rule      static rule id (syntax-tree/regex rule, shellcheck SC code, or a
#             chkscript coverage warning)
#   category  "unsafe", "capability" or "lint" (docs/spec.md, Finding categories)
#   verdict   "true-positive": the matched code runs, during install or later
#             from a generated file the installer writes, and does what the
#             rule describes.
#             "noise": the match is on text that never runs during install (a
#             heredoc message), a wrong span, a lint that is not a safety
#             concern, or a benign idiom the rule was not written for.
#   note      one line; mktemp cleanups say "mktemp cleanup" so they can be
#             counted
#   lines     every non-shellcheck rule: the exact lines that fire
#   count     instead of lines, for runs-as-root: how many lines fire
#   file      optional; a generated child file's path as written (findings in a
#             heredoc the installer writes and later runs); defaults to the
#             installer itself. Lines are then the child's own.
#   engines   optional; defaults to both ["shfmt", "regex"]. An entry for the
#             regex engine alone is where the fallback over-reports by design.
#
# A footprint table holds the fields of the JSON `footprint`. TOML has no null,
# so a field chkscript cannot back is written "null". `unresolved_at` and
# `unresolved_writes` are [file, line] pairs and are omitted when empty.
#
# shellcheck entries are pinned by rule id, not line or file.

[rustup]
max_severity = "warning"

[[rustup.finding]]
rule = "unverified-download"
category = "capability"
lines = [175]
verdict = "true-positive"
note = "Downloads rustup-init over HTTPS (through `ensure downloader`) and runs `chmod u+x` with no checksum or signature check; trust rests on TLS alone. A capability now, not unsafe."

[[rustup.finding]]
rule = "unverified-download"
category = "capability"
lines = [315]
engines = ["regex"]
verdict = "noise"
note = "Regex fallback only: `chmod u+x \"$_tmp\"` on a helper decoded from a heredoc, not a download; the fallback ties files by text and no verifier names $_tmp."

[rustup.footprint]
privilege = "user"
persistence = "null"
network_hosts = ["static.rust-lang.org", "(unresolved)"]
coverage = "full"
unresolved_writes = [["<entry>", 703], ["<entry>", 710], ["<entry>", 714], ["<entry>", 729], ["<entry>", 735], ["<entry>", 741], ["<entry>", 744]]
absent = "null"

[rustup.regex_footprint]
privilege = "null"
persistence = "null"
network_hosts = ["github.com", "static.rust-lang.org", "(unresolved)"]
coverage = "reduced"
absent = "null"

