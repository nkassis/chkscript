[k3s]
max_severity = "unsafe"

[[k3s.finding]]
rule = "rm-rf-variable"
lines = [237, 354, 878, 943, 952]
verdict = "noise"
note = "237: constant BIN_DIR test path inside `sh -c`; 354: mktemp cleanup of TMP_DIR; 878, 943, 952: text of the generated killall/uninstall scripts (heredocs), not run at install."

[[k3s.finding]]
rule = "eval-dynamic"
lines = [1203]
verdict = "true-positive"
note = "`eval set -- $(escape \"${INSTALL_K3S_EXEC}\") ...` evaluates environment-supplied text; deliberate and escaped, but exactly what the rule describes."

# Line 580 (`$SUDO chown root:root ${TMP_BIN}`) used to fire insecure-permissions
# under Semgrep only: its pattern-regex `(\S+\s+)*` crossed newlines to a later
# /tmp. NIM-98 confined every pattern-regex to one line, so the engines agree.

[[k3s.finding]]
rule = "semgrep-parse-error"
engines = ["semgrep"]
verdict = "noise"
note = "Accurate coverage notice (Semgrep cannot fully parse the file), but it says nothing about the script."

[[k3s.finding]]
rule = "SC2006"
