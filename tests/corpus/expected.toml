lines = [146, 154, 369, 371]
engines = ["regex"]
verdict = "noise"
note = "Regex fallback only: `curl ... | $SUDO tar -xzf -`; the fallback reads a variable receiver as a possible shell, where the syntax tree resolves SUDO to sudo or empty."

[[ollama.finding]]
