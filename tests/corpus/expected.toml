lines = [166]
verdict = "true-positive"
note = "Runs `$SUDO rm -rf \"$OLLAMA_INSTALL_DIR/lib/ollama\"` as root on a variable path; low impact (an empty variable deletes /lib/ollama, not /)."

[[ollama.finding]]
rule = "persistence-append"
lines = [215]
verdict = "true-positive"
note = "Writes /etc/systemd/system/ollama.service via `sudo tee`: real persistence, expected for a server install."

[[ollama.finding]]
