name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Install Python and dependencies
        run: uv sync --locked
      - name: Install static analyzers
        env:
          # Pinned release binary; the digest is GitHub's for this asset, checked
          # against an independently downloaded copy. Bump both together.
          SHFMT_VERSION: v3.14.1
          SHFMT_SHA256: 76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck --version
          mkdir -p "$HOME/.local/bin"
          curl -fsSL --proto '=https' -o "$RUNNER_TEMP/shfmt" \
            "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/shfmt_${SHFMT_VERSION}_linux_amd64"
          echo "${SHFMT_SHA256}  $RUNNER_TEMP/shfmt" | sha256sum --check --strict
          install -m 0755 "$RUNNER_TEMP/shfmt" "$HOME/.local/bin/shfmt"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/shfmt" --version
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run black --check .
      - name: Test
        env:
          # A missing shellcheck/shfmt fails tool-gated tests instead of skipping.
          CHKSCRIPT_REQUIRE_TOOLS: "1"
        run: uv run pytest
