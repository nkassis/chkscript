name: secret-scan

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  trufflehog:
    name: TruffleHog (verified secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan commits in this push or PR
        # Pinned: an unpinned security action is itself a supply-chain risk. Dependabot bumps it.
        uses: trufflesecurity/trufflehog@v3.99.7
        with:
          # Left empty, the action scans before..after on a push and the PR's base..head on a PR.
          # A new branch has no `before`, so scan only what it adds over the default branch
          # instead of the full history. Full-history scan: security/README.md.
          base: ${{ github.event.created && github.event.commits[0] && format('origin/{0}', github.event.repository.default_branch) || '' }}
          head: ${{ github.event.created && github.event.commits[0] && github.event.after || '' }}
          extra_args: --results=verified  # the action already passes --fail
